<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BrkrStudios</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        html, body {
            height: 100%;
            background: #000;
            color: #fff;
            font-family: -apple-system, BlinkMacSystemFont, "Helvetica Neue", Arial, sans-serif;
        }
        body {
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 24px;
            text-align: center;
        }
        main {
            max-width: 640px;
        }
        p {
            font-size: clamp(18px, 2.4vw, 22px);
            line-height: 1.6;
            font-weight: 300;
            letter-spacing: 0.2px;
        }
    </style>
</head>
<body>
    <main>
        <p>BrkrStudios is being shut down. We thank everyone for the support, but we are voluntarily closing to move forward with other exciting projects.</p>
    </main>
</body>
</html>
